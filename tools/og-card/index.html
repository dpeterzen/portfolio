<!doctype html>
<!--
  Link-preview card for danimal-dev.com. Not deployed: it lives outside dist/.
  Re-render after a change (from the repo root):
    "/Applications/Google Chrome.app/Contents/MacOS/Google Chrome" --headless=new --hide-scrollbars \
      --allow-file-access-from-files --window-size=1200,630 --force-device-scale-factor=1 \
      --virtual-time-budget=4000 --screenshot=/tmp/og.png "file://$PWD/tools/og-card/index.html"
    sips -s format jpeg -s formatOptions 85 /tmp/og.png --out dist/assets/og-image.jpg
  Deliberately not a pitch: the night city, the one lit window the site lets you enter, and the
  name. The window and chip sit inside the middle 630px, because WhatsApp and some iMessage
  layouts crop the image to a square.
-->
<html lang="en">
<head>
<meta charset="utf-8">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@500&display=swap">
<style>
  *{box-sizing:border-box;margin:0}
  html,body{width:1200px;height:630px;overflow:hidden;background:#2b2119}
  /* The 1671x941 Dune city at 1.3x, placed so its lit window, (1215,580) in the source, lands at (620,370). */
  .scene{position:absolute;left:-960px;top:-384px;width:2172px;height:1223px;background:url('../../dist/assets/dune-city-cross.png') 0 0/100% 100%}
  .vignette{position:absolute;inset:0;background:radial-gradient(ellipse 70% 85% at 620px 370px,transparent 30%,#140d08b0 100%)}
  /* The scene's dotted target, with the border beam caught mid-turn. */
  .spot{position:absolute;left:620px;top:370px;width:136px;height:100px;transform:translate(-50%,-50%);border-radius:50%;
    border:2px dotted #f4d295a8;box-shadow:0 0 28px #ffdb9b38,inset 0 0 22px #ffdb9b18}
  .spot::after{content:'';position:absolute;inset:-4px;border-radius:50%;padding:4px;
    background:conic-gradient(from 210deg,transparent 0 60%,#f4d29550 76%,#ffe7b0 91%,#fff8e6 94%,transparent 97%);
    -webkit-mask:linear-gradient(#000 0 0) content-box,linear-gradient(#000 0 0);-webkit-mask-composite:xor}
  /* Same glass chip as the site's scene hint (.lamp-hint), scaled up. */
  .chip{position:absolute;left:620px;top:442px;transform:translateX(-50%);display:flex;align-items:center;gap:14px;padding:12px 20px;
    border:1px solid #ffffff30;border-radius:8px;background:linear-gradient(#ffffff0c,#ffffff00),#3a3027b8;
    box-shadow:inset 0 1px 0 #ffffff12,0 6px 22px #0005;color:#e4d6b6;font:500 30px/1 'IBM Plex Mono',monospace;letter-spacing:.5px;white-space:nowrap}
  .chip::before{content:'';width:11px;height:11px;background:#eac789}
</style>
</head>
<body>
  <div class="scene"></div>
  <div class="vignette"></div>
  <div class="spot"></div>
  <div class="chip">danimal dev</div>
</body>
</html>
