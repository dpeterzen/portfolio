<!doctype html>
<!--
  Link-preview card for danimal-dev.com. Not deployed: it lives outside dist/.
  Re-render after a change (from the repo root):
    "/Applications/Google Chrome.app/Contents/MacOS/Google Chrome" --headless=new --hide-scrollbars \
      --allow-file-access-from-files --window-size=1200,630 --force-device-scale-factor=1 \
      --virtual-time-budget=4000 --screenshot=/tmp/og.png "file://$PWD/tools/og-card/index.html"
    sips -s format jpeg -s formatOptions 85 /tmp/og.png --out dist/assets/og-image.jpg
  The site in miniature, not a pitch: the Dune desktop, one Notepad window holding only the
  name, and the taskbar. No tagline on purpose. The name sits inside
  the middle 630px, because WhatsApp and some iMessage layouts crop the image to a square.
  Colours and bevels are copied from dist/styles.css (Dune theme).
-->
<html lang="en">
<head>
<meta charset="utf-8">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Pixelify+Sans:wght@500;600&family=IBM+Plex+Mono:wght@400;500&display=swap">
<style>
  :root{--chrome:#c6bba1;--chrome-mid:#b0a58d;--bevel-light:#ede2c7;--bevel-shadow:#716653;--bevel-dark:#3e382f;--ink:#352f25;--muted:#776b57;--paper:#e3dac4;
    --title:#62523a;--title-end:#8b7957;--title-ink:#f3e4c7;--pixel:'Pixelify Sans',monospace;--mono:'IBM Plex Mono',monospace}
  *{box-sizing:border-box;margin:0}
  html,body{width:1200px;height:630px;overflow:hidden;background:#2b2119}
  .raised{background:var(--chrome);box-shadow:inset 1px 1px var(--bevel-light),inset -1px -1px var(--bevel-dark),inset 2px 2px #ffffff28,inset -2px -2px var(--bevel-shadow);color:var(--ink)}
  .sunken{box-shadow:inset 1px 1px var(--bevel-shadow),inset -1px -1px var(--bevel-light)}
  .scene{position:absolute;inset:0 0 56px;background:url('../../dist/assets/dune-city-cross.png') center top/1200px auto}
  .window{position:absolute;left:50%;top:92px;width:620px;transform:translateX(-50%);padding:4px;box-shadow:inset 1px 1px var(--bevel-light),inset -1px -1px var(--bevel-dark),inset -2px -2px var(--bevel-shadow),0 18px 44px #000a;background:var(--chrome)}
  .titlebar{height:42px;display:flex;align-items:center;justify-content:space-between;padding:0 6px 0 10px;
    background:linear-gradient(90deg,var(--title),var(--title-end));color:var(--title-ink);font:500 22px var(--pixel)}
  .titlebar .t{display:flex;align-items:center;gap:10px}
  .titlebar img{width:24px;height:24px;image-rendering:pixelated}
  .controls{display:flex;gap:4px}
  .controls i{width:32px;height:28px;display:grid;place-items:center;font:600 15px var(--mono);font-style:normal}
  .body{margin-top:4px;background:var(--paper);height:178px;display:grid;place-items:center}
  h1{font:600 88px/1 var(--pixel);color:var(--ink);letter-spacing:1px}
  h1 .cursor{display:inline-block;width:.42em;height:.11em;margin-left:.1em;background:var(--ink);vertical-align:.02em}
  .status{display:flex;gap:4px;margin-top:4px;font:400 16px var(--mono);color:var(--muted)}
  .status span{flex:1;padding:7px 11px}
  .status span:last-child{flex:0 0 36%}
  .taskbar{position:absolute;inset:auto 0 0;height:56px;display:flex;align-items:center;gap:10px;padding:7px;background:var(--chrome);box-shadow:inset 0 1px var(--bevel-light),inset 0 3px var(--chrome-mid)}
  .start{height:42px;display:flex;align-items:center;gap:10px;padding:0 16px;font:500 23px var(--pixel)}
  .task{height:40px;width:230px;display:flex;align-items:center;gap:9px;padding:0 12px;font:600 15px var(--mono);color:var(--ink);
    background:var(--paper) repeating-conic-gradient(#ffffff15 0% 25%,transparent 0% 50%) 0 0/2px 2px}
  .task img{width:20px;height:20px;image-rendering:pixelated}
  .tray{margin-left:auto;height:40px;display:flex;align-items:center;gap:10px;padding:0 14px;font:500 15px var(--mono);color:var(--ink)}
  .tray i{width:8px;height:8px;background:#7f9a5f;box-shadow:0 0 6px #a9cf7f}
</style>
</head>
<body>
  <div class="scene"></div>
  <div class="window">
    <div class="titlebar"><span class="t"><img src="../../dist/assets/favicon.svg" alt="">readme.txt</span><span class="controls"><i class="raised">_</i><i class="raised">□</i><i class="raised">×</i></span></div>
    <div class="body sunken"><h1>danimal dev<span class="cursor"></span></h1></div>
    <div class="status"><span class="sunken">danimal-dev.com</span><span class="sunken">Hello world!</span></div>
  </div>
  <div class="taskbar">
    <span class="start raised"><svg viewBox="0 0 16 16" width="22" height="22" aria-hidden="true"><path d="M1 1h6v6H1Zm8 0h6v6H9ZM1 9h6v6H1Zm8 0h6v6H9Z" fill="#352f25"/></svg>Start</span>
    <span class="task sunken"><img src="../../dist/assets/favicon.svg" alt="">readme.txt</span>
    <span class="tray sunken"><i></i></span>
  </div>
</body>
</html>
